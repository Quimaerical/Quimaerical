<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 270" width="100%" height="100%">
  <defs>
    <style>
      @keyframes sparkFlicker {
        0%, 100% { fill: #faec03; opacity: 1; transform: scale(1); }
        33%      { fill: #ffffff; opacity: 0.9; transform: scale(1.15) translate(1px, -1px); }
        66%      { fill: #ff7700; opacity: 0.8; transform: scale(0.9) translate(-1px, 1px); }
      }
      @keyframes sparkFly {
        0%   { opacity: 0; transform: translate(0, 0); }
        50%  { opacity: 1; transform: translate(2px, -3px); fill: #ffffff; }
        100% { opacity: 0; transform: translate(4px, -6px); fill: #faec03; }
      }
      @keyframes eyeGlow {
        0%, 100% { fill: #3dbbf2; }
        50%      { fill: #8ce1ff; }
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 900;
        white-space: pre;
      }
      .eye {
        animation: eyeGlow 2.5s infinite ease-in-out;
      }
      .spark {
        animation: sparkFlicker 0.22s infinite alternate ease-in-out;
        transform-origin: 430px 140px;
      }
      .spark-burst {
        animation: sparkFly 0.4s infinite ease-out;
      }
      .bomb {
        fill: #010101;
      }
      .edge {
        fill: #851817;
      }
      .white {
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Crimson Background matching medjedbomb.jpg -->
  <rect width="540" height="270" rx="10" fill="#c52a28" />

  <!-- ASCII Medjed Bomb Body -->
  <g class="font-mono" transform="translate(5, 5)">
    <text x="10" y="20.0">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;</text>
